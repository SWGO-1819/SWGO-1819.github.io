### Skills [ skills ]
skills:
  title: "개발 스킬"
  subtitle: "my <b>Talent</b>"
  bg_title: "스킬"

  column1:
    items:
      - label: "C/C++" #0-10 progress in dots
        text: "DPS, BPS 과정을 완료하며 시스템 프로그래밍과 저수준 메모리 관리에 대한 탄탄한 기초를 구축했습니다. 효율적인 자료구조 설계와 알고리즘 구현, 성능 최적화가 중요한 시스템 소프트웨어 개발이 가능합니다."
        value: "80" #0-100 progress in %

      - label: "Python" #0-10 progress in dots
        text: "현재 음성 데이터의 실시간 암호화/복호화 시스템을 개발 중이며, 다양한 암호화 알고리즘과 오디오 처리 기술을 활용하고 있습니다. 데이터 분석, 웹 크롤링, 머신러닝 모델 구현 등 Python의 다양한 라이브러리를 활용한 개발 경험을 보유하고 있습니다."
        value: "95" #0-100 progress in %

  column2:
    items:
      - label: "Java" #0-10 progress in dots
        text: "Discord bot를 활용한 봇 개발 프로젝트를 통해 실시간 메시지 처리, 데이터베이스 연동, API 활용 경험을 쌓았습니다.객체지향 프로그래밍과 멀티스레딩을 활용한 애플리케이션 개발이 가능합니다."
        value: "80" #0-100 progress in %

      - label: "JSP" #0-10 progress in dots
        text: "MVC 패턴을 기반으로 한 동적 웹 애플리케이션 개발이 가능하며, 사용자 인증 시스템과 게시판 시스템 구현 경험이 있습니다. 세션 관리, 파일 업로드/다운로드, 서블릿 연동 등 웹 개발의 핵심 기능들을 구현할 수 있습니다"
        value: "70" #0-100 progress in %

  column3:
    items:
      - label: "MySQL" #0-10 progress in dots
        text: "정규화된 데이터베이스 설계와 복잡한 JOIN 쿼리 작성, 인덱스 최적화를 통한 성능 향상이 가능합니다. JSP와의 연동을 통한 풀스택 웹 애플리케이션 개발 및 트랜잭션 처리를 통한 경험을 보유하고 있습니다."
        value: "90" #0-100 progress in %

      - label: "C#" #0-10 progress in dots
        text: "기업 환경에서 소프트웨어 유지보수 업무를 수행하며 기존 시스템의 버그 수정, 기능 개선, 코드 리팩토링 경험을 쌓았습니다."
        value: "80" #0-100 progress in %

